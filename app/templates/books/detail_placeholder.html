{% extends "base.html" %}

{% block content %}
  <section class="card">
    <div class="card-body">
      <p class="app-kicker small fw-semibold mb-2">Book detail</p>
      <h1 class="h3">{{ book.title }}</h1>
      {% if book.primary_author_name %}<p class="app-muted mb-3">{{ book.primary_author_name }}</p>{% endif %}
      <p class="app-muted mb-4">Full detail view lands in Chunk 9. The new book was saved successfully.</p>
      <a class="btn btn-outline-primary" href="/books">Back to Books</a>
    </div>
  </section>
{% endblock %}
